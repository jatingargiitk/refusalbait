name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke-test the packed CLI
        run: |
          npm pack
          dir=$(mktemp -d)
          npm install --prefix "$dir" ./refusalbait-*.tgz
          bin="$dir/node_modules/.bin/refusalbait"
          "$bin" --version
          # The fixtures contain planted payloads, so the default --fail-on high must exit 1.
          set +e
          "$bin" test/fixtures --no-color
          code=$?
          set -e
          test "$code" -eq 1
          "$bin" test/fixtures --fail-on none > /dev/null
          "$bin" test/fixtures/clean
          "$bin" test/fixtures --sarif --fail-on none | node -e 'const s=JSON.parse(require("fs").readFileSync(0,"utf8")); if (s.version!=="2.1.0" || !s.runs[0].results.length) process.exit(1)'
